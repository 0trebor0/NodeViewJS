name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  windows:
    # 20 is the minimum version package.json supports, so it is tested on every
    # change rather than assumed to work.
    name: Windows (Node ${{ matrix.node-version }})
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build native host
        run: npm run build
      - name: Run unit and packaging tests
        run: npm test
      - name: Run release security gate
        if: matrix.node-version == '22'
        run: npm run security:gate
      # The runner can create a WebView2 controller but cannot complete browser
      # navigation, so the suites that drive a live page (test:native) and the
      # ones that need an interactive desktop (test:native-ui) are not run here.
      # See PLAN.md DBG-01. Run `npm run test:full` locally before a release.
      - name: Run native lifecycle test
        run: npm run test:native-lifecycle
      - name: Preview npm package
        run: npm pack --dry-run

  package:
    # Proves the published artifact installs and resolves on the minimum
    # supported Node version without a compiler toolchain.
    name: Packed artifact (Node 20)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Preview npm package
        run: npm pack --dry-run
      - name: Check public exports
        run: npm run test:exports
      - name: Check type declarations
        run: npm run test:types
      - name: Install from the packed tarball
        run: npm run test:tarball

  macos:
    name: macOS
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build native host
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Run live bridge tests
        run: npm run test:bridge
      - name: Run multi-window integration
        run: npm run test:multi-window
      - name: Package app and DMG
        run: npm run package:macos

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config xvfb xauth
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build native host
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Run live bridge tests
        run: xvfb-run --auto-servernum npm run test:bridge
      - name: Run multi-window integration
        run: xvfb-run --auto-servernum npm run test:multi-window
      - name: Package app folder
        run: npm run package:linux
