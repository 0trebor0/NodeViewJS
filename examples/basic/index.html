<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NodeViewJS Media Loader</title>

    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 3rem;
        color: #20232a;
        background: #f6f7f9;
      }

      h1 {
        margin-bottom: 0.5rem;
      }

      button {
        margin-right: 0.5rem;
        margin-bottom: 1rem;
        padding: 0.6rem 1rem;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: white;
      }

      button:hover {
        background: #eeeeee;
      }

      #output {
        margin-top: 1rem;
        font-weight: 600;
      }

      .media-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1rem;
        margin-top: 1.5rem;
      }

      .media-card {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 0.75rem;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }

      img,
      video,
      audio {
        width: 100%;
        max-height: 260px;
        background: #000;
        border-radius: 8px;
      }

      img {
        object-fit: cover;
      }

      .filename {
        margin-top: 0.5rem;
        font-size: 0.9rem;
        word-break: break-word;
        color: #333;
      }

      .filepath {
        margin-top: 0.25rem;
        font-size: 0.75rem;
        word-break: break-word;
        color: #777;
      }

      .empty {
        padding: 1rem;
        background: white;
        border: 1px dashed #bbb;
        border-radius: 8px;
        margin-top: 1rem;
      }
    </style>
  </head>

  <body>
    <h1>NodeViewJS Local Media Loader</h1>

    <p>Load images, videos, and audio from your local Windows user folders, including subfolders.</p>

    <div>
      <button data-folder="pictures">Load Pictures</button>
      <button data-folder="videos">Load Videos</button>
      <button data-folder="music">Load Music</button>
      <button data-folder="downloads">Load Downloads</button>
    </div>

    <p id="output" role="status"></p>

    <div id="media" class="media-grid"></div>

    <script>
      const output = document.querySelector("#output");
      const mediaContainer = document.querySelector("#media");

      document.querySelectorAll("button[data-folder]").forEach(button => {
        button.addEventListener("click", async () => {
          const folder = button.dataset.folder;

          output.textContent = `Loading ${folder} and subfolders...`;
          mediaContainer.innerHTML = "";

          let result;

          try {
            result = await NodeViewJS.invoke("loadMedia", { folder });
          } catch (error) {
            output.textContent = "Failed to call NodeViewJS command.";
            console.error(error);
            return;
          }

          if (result.error) {
            output.textContent = result.message;
            console.error(result.details);
            return;
          }

          output.textContent = result.truncated
            ? `Showing first ${result.count} media file(s) from ${result.folderPath}. Narrow the folder or add paging to load more.`
            : `Loaded ${result.count} media file(s) from ${result.folderPath}`;

          if (!result.media.length) {
            mediaContainer.innerHTML = `
              <div class="empty">
                No media files found in this folder or its subfolders.
              </div>
            `;
            return;
          }

          for (const file of result.media) {
            const card = document.createElement("div");
            card.className = "media-card";

            let element;

            if (file.type === "image") {
              element = document.createElement("img");
              element.src = file.url;
              element.alt = file.name;
              element.loading = "lazy";
            }

            else if (file.type === "video") {
              element = document.createElement("video");
              element.src = file.url;
              element.controls = true;
              element.preload = "metadata";
            }

            else if (file.type === "audio") {
              element = document.createElement("audio");
              element.src = file.url;
              element.controls = true;
              element.preload = "metadata";
            }

            else {
              element = document.createElement("p");
              element.textContent = "Unsupported file type";
            }

            const filename = document.createElement("div");
            filename.className = "filename";
            filename.textContent = file.relativePath;

            const filepath = document.createElement("div");
            filepath.className = "filepath";
            filepath.textContent = file.path;

            card.appendChild(element);
            card.appendChild(filename);
            card.appendChild(filepath);

            mediaContainer.appendChild(card);
          }
        });
      });
    </script>
  </body>
</html>
