<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NodeViewJS Media Loader</title>
  </head>

  <body>
    <h1 id="title"></h1>
    <script>
      window.onload = async () => {
        NodeViewJS.on("hey", data => {
          console.log(data);
          document.getElementById("title").innerText = data.msg;
        });
        NodeViewJS.emit("frontend-ready");
        await NodeViewJS.invoke("greet", {'test':'Hello World!'});
      }
    </script>
  </body>
</html>
